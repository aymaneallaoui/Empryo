name: aur

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Empryo version, e.g. 3.12.1-beta (empty: latest from dl.empryo.com)"
        required: false
  push:
    branches: [main]
    paths:
      - packaging/aur/PKGBUILD
      - packaging/aur/.SRCINFO

permissions: {}

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: pacman -Syu --noconfirm --needed git jq pacman-contrib

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bump PKGBUILD
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          useradd -m builder
          cp -r packaging/aur /tmp/aur
          chown -R builder /tmp/aur
          sudo -u builder -H /tmp/aur/update.sh "$VERSION"
          cp /tmp/aur/PKGBUILD /tmp/aur/.SRCINFO packaging/aur/
          if ! git diff --quiet -- packaging/aur; then
            echo "version=$(sed -n 's/^_ver=//p' packaging/aur/PKGBUILD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.bump.outputs.version
        run: sudo -u builder -H sh -c 'cd /tmp/aur && makepkg -fd --noconfirm'

      - if: steps.bump.outputs.version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
          branch: aur/empryo-bin-update
          delete-branch: true
          commit-message: "packaging: update empryo-bin to ${{ steps.bump.outputs.version }}"
          title: "packaging: update empryo-bin to ${{ steps.bump.outputs.version }}"
          body: |
            Automated bump from https://dl.empryo.com/latest.json.
            Both sha256sums match SHA256SUMS.txt and the x86_64 package builds. Merging publishes it to the AUR.

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check .SRCINFO matches PKGBUILD
        working-directory: packaging/aur
        run: |
          useradd -m builder
          sudo -u builder -H makepkg --printsrcinfo | diff -u .SRCINFO -

      - if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, skipping AUR publish"

      - name: Push to AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          pacman -Syu --noconfirm --needed git openssh
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as listed on aur.archlinux.org.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/empryo-bin.git /tmp/aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR is already up to date"
            exit 0
          fi
          ver=$(sed -n 's/^\tpkgver = //p' .SRCINFO)-$(sed -n 's/^\tpkgrel = //p' .SRCINFO)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update to $ver"
          git push origin HEAD:master
